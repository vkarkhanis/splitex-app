appId: com.traxettle.app
name: Settlement — USD expenses settled in INR at a set rate (Pro)
# Like same-currency-mock, but the organiser (Pro) creates the event in USD to settle in INR at a
# predefined 1 USD = 83 INR, so the member's $100 share is paid as ₹8300.00. No live rates.
---
- evalScript: ${output.runId = Date.now().toString()}
- runFlow:
    file: ../../subflows/sign-up.yaml
    env:
      NAME: "FX Admin ${output.runId}"
      EMAIL: "fxadm${output.runId}@example.com"
- runFlow: ../../subflows/switch-to-pro.yaml
- tapOn:
    id: "dashboard-create-event-button"
- tapOn:
    id: "create-event-name-input"
- inputText: "Maestro FX ${output.runId}"
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: "create-event-currency-USD"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "create-event-currency-USD"
- scrollUntilVisible:
    element:
      id: "create-event-settlement-INR"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "create-event-settlement-INR"
- scrollUntilVisible:
    element:
      id: "create-event-fx-mode-predefined"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "create-event-fx-mode-predefined"
- tapOn:
    id: "create-event-fx-rate-input"
- inputText: "83"
# Close the number pad (it has no Enter key) by tapping the field's label: it can cover the buttons below.
- tapOn: "1 USD = .*"
- scrollUntilVisible:
    element:
      id: "create-event-submit-button"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "create-event-submit-button"
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible:
      id: "event-detail-tab-expenses"
    timeout: 20000
- runFlow: ../../subflows/wait-for-toast.yaml
- runFlow:
    file: ../../subflows/invite.yaml
    env:
      EMAIL: "fxmb${output.runId}@example.com"

# The member joins.
- runFlow:
    file: ../../subflows/sign-up.yaml
    env:
      NAME: "FX Member ${output.runId}"
      EMAIL: "fxmb${output.runId}@example.com"
- runFlow: ../../subflows/accept-invitation.yaml

# The organiser adds dinner and settles up; the plan goes to review.
- runFlow:
    file: ../../subflows/sign-in.yaml
    env:
      EMAIL: "fxadm${output.runId}@example.com"
- runFlow:
    file: ../../subflows/open-event.yaml
    env:
      EVENT: "Maestro FX ${output.runId}"
- runFlow:
    file: ../../subflows/add-expense.yaml
    env:
      TITLE: "Hotel ${output.runId}"
      AMOUNT: "200"
- tapOn:
    id: "event-detail-settle-button"
- tapOn:
    id: "confirm-button-settle-now"
- extendedWaitUntil:
    visible:
      id: "event-detail-approve-settlement"
    timeout: 20000
- tapOn:
    id: "event-detail-approve-settlement"
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible: ".*You have approved.*"
    timeout: 20000

# The member approves too, then records paying their $100 share as ₹8300.00.
- runFlow:
    file: ../../subflows/sign-in.yaml
    env:
      EMAIL: "fxmb${output.runId}@example.com"
- runFlow:
    file: ../../subflows/open-event.yaml
    env:
      EVENT: "Maestro FX ${output.runId}"
- scrollUntilVisible:
    element:
      id: "event-detail-approve-settlement"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "event-detail-approve-settlement"
- tapOn:
    text: "OK"
    optional: true
- scrollUntilVisible:
    element:
      id: "event-detail-settlement-pay-.*"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: ".*₹8,?300\\.00.*"
- tapOn:
    id: "event-detail-settlement-pay-.*"
- extendedWaitUntil:
    visible: "Pay Settlement"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "event-detail-mark-paid-submit"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "event-detail-mark-paid-submit"
- tapOn:
    text: "OK"
    optional: true

# The organiser confirms receipt; the event is settled and can be closed.
- runFlow:
    file: ../../subflows/sign-in.yaml
    env:
      EMAIL: "fxadm${output.runId}@example.com"
- runFlow:
    file: ../../subflows/open-event.yaml
    env:
      EVENT: "Maestro FX ${output.runId}"
- scrollUntilVisible:
    element:
      id: "event-detail-settlement-confirm-.*"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "event-detail-settlement-confirm-.*"
- tapOn:
    text: "OK"
    optional: true
- scrollUntilVisible:
    element:
      id: "event-detail-close-event"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "event-detail-close-event"
- tapOn:
    id: "confirm-button-close"
- extendedWaitUntil:
    visible:
      id: "dashboard-create-event-button"
    timeout: 20000
- assertNotVisible: ".*Maestro FX ${output.runId}.*"
