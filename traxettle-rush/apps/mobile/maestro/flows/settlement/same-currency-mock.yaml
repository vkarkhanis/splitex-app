appId: com.traxettle.app
name: Settlement — same currency, from an expense to a closed event
# Two people: the organiser pays for dinner, settles up, both approve the plan, the member records
# the payment, the organiser confirms it and closes the event.
---
- evalScript: ${output.runId = Date.now().toString()}
- runFlow:
    file: ../../subflows/sign-up.yaml
    env:
      NAME: "Settle Admin ${output.runId}"
      EMAIL: "sadm${output.runId}@example.com"
- runFlow:
    file: ../../subflows/create-split-event.yaml
    env:
      EVENT: "Maestro Same ${output.runId}"
      CURRENCY: "USD"
- runFlow:
    file: ../../subflows/invite.yaml
    env:
      EMAIL: "smb${output.runId}@example.com"

# The member joins.
- runFlow:
    file: ../../subflows/sign-up.yaml
    env:
      NAME: "Settle Member ${output.runId}"
      EMAIL: "smb${output.runId}@example.com"
- runFlow: ../../subflows/accept-invitation.yaml

# The organiser adds dinner and settles up; the plan goes to review.
- runFlow:
    file: ../../subflows/sign-in.yaml
    env:
      EMAIL: "sadm${output.runId}@example.com"
- runFlow:
    file: ../../subflows/open-event.yaml
    env:
      EVENT: "Maestro Same ${output.runId}"
- runFlow:
    file: ../../subflows/add-expense.yaml
    env:
      TITLE: "Dinner ${output.runId}"
      AMOUNT: "120"
- tapOn:
    id: "event-detail-settle-button"
- tapOn:
    id: "confirm-button-settle-now"
- extendedWaitUntil:
    visible:
      id: "event-detail-approve-settlement"
    timeout: 20000
- tapOn:
    id: "event-detail-approve-settlement"
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible: ".*You have approved.*"
    timeout: 20000

# The member approves too, then records paying $60.
- runFlow:
    file: ../../subflows/sign-in.yaml
    env:
      EMAIL: "smb${output.runId}@example.com"
- runFlow:
    file: ../../subflows/open-event.yaml
    env:
      EVENT: "Maestro Same ${output.runId}"
- scrollUntilVisible:
    element:
      id: "event-detail-approve-settlement"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "event-detail-approve-settlement"
- tapOn:
    text: "OK"
    optional: true
- scrollUntilVisible:
    element:
      id: "event-detail-settlement-pay-.*"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: ".*\\$60\\.00.*"
- tapOn:
    id: "event-detail-settlement-pay-.*"
- extendedWaitUntil:
    visible: "Pay Settlement"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "event-detail-mark-paid-submit"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "event-detail-mark-paid-submit"
- tapOn:
    text: "OK"
    optional: true

# The organiser confirms receipt; the event is settled and can be closed.
- runFlow:
    file: ../../subflows/sign-in.yaml
    env:
      EMAIL: "sadm${output.runId}@example.com"
- runFlow:
    file: ../../subflows/open-event.yaml
    env:
      EVENT: "Maestro Same ${output.runId}"
- scrollUntilVisible:
    element:
      id: "event-detail-settlement-confirm-.*"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "event-detail-settlement-confirm-.*"
- tapOn:
    text: "OK"
    optional: true
- scrollUntilVisible:
    element:
      id: "event-detail-close-event"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "event-detail-close-event"
- tapOn:
    id: "confirm-button-close"
- extendedWaitUntil:
    visible:
      id: "dashboard-create-event-button"
    timeout: 20000
- assertNotVisible: ".*Maestro Same ${output.runId}.*"
