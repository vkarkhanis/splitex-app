appId: com.traxettle.app
name: Navigation — invitations inbox and closed-events history
---
- evalScript: ${output.runId = Date.now().toString()}
- runFlow:
    file: ../../subflows/sign-up.yaml
    env:
      NAME: "Nav User ${output.runId}"
      EMAIL: "nav${output.runId}@example.com"
- tapOn:
    id: "dashboard-avatar-menu"
- tapOn:
    id: "menu-invitations"
- extendedWaitUntil:
    visible: "See all active"
    timeout: 10000
- assertVisible: "Email 3-month history"
- tapOn: "See all active"
- assertVisible: "Show newest 5"
- runFlow: ../../subflows/go-back.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard-create-event-button"
    timeout: 10000
- tapOn:
    id: "dashboard-avatar-menu"
- tapOn:
    id: "menu-closed-events"
- extendedWaitUntil:
    visible: "Email last 3 months"
    timeout: 10000
- assertVisible: "Showing latest 5 closed events"
- runFlow: ../../subflows/go-back.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard-create-event-button"
    timeout: 10000
