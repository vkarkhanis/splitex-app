appId: com.traxettle.app
name: Events — create an event, add an expense, invite someone
---
- evalScript: ${output.runId = Date.now().toString()}
- runFlow:
    file: ../../subflows/sign-up.yaml
    env:
      NAME: "Event Manager ${output.runId}"
      EMAIL: "evtmgr${output.runId}@example.com"

# Create a new event
- runFlow:
    file: ../../subflows/create-split-event.yaml
    env:
      EVENT: "Maestro Event ${output.runId}"
      CURRENCY: "USD"
- assertVisible: ".*Maestro Event ${output.runId}.*"

# Navigate to expense tab
- extendedWaitUntil:
    visible:
      id: "event-detail-tab-expenses"
    timeout: 20000

# Add an expense
- tapOn:
    id: "event-detail-add-expense-button"
- tapOn:
    id: "create-expense-title-input"
- inputText: "Lunch ${output.runId}"
- tapOn:
    id: "create-expense-amount-input"
- inputText: "50"
- runFlow:
    file: ../../subflows/close-number-pad.yaml
    env:
      LABEL: "Amount \\(.*\\)"
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: "create-expense-submit-button"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "create-expense-submit-button"
    optional: true
- extendedWaitUntil:
    notVisible: "Add Expense"
    timeout: 30000
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible: ".*Maestro Event ${output.runId}.*"
    timeout: 10000
- assertVisible: ".*Lunch ${output.runId}.*"

# Navigate to participants tab
- tapOn:
    id: "event-detail-tab-participants"
- extendedWaitUntil:
    visible:
      id: "event-detail-open-invite-modal-participants"
    timeout: 10000

# Open invite modal
- tapOn:
    id: "event-detail-open-invite-modal-participants"
- tapOn:
    id: "event-detail-invite-email-input"
- inputText: "invited${output.runId}@example.com"
- tapOn:
    text: "Send"
- tapOn:
    text: "Send"
    optional: true
- extendedWaitUntil:
    notVisible: "Invite to Event"
    timeout: 10000

# Navigate to invitations tab and verify
- tapOn:
    id: "event-detail-tab-invitations"
- extendedWaitUntil:
    visible: ".*invited${output.runId}@example.com.*"
    timeout: 10000

# Navigate to groups tab
- tapOn:
    id: "event-detail-tab-groups"
- extendedWaitUntil:
    visible:
      id: "event-detail-open-create-group-modal"
    timeout: 10000

# Go back to dashboard
- runFlow: ../../subflows/go-back.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard-create-event-button"
    timeout: 10000
- assertVisible: ".*Maestro Event ${output.runId}.*"
