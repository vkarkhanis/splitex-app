appId: com.traxettle.app
name: Auth and profile
# Register, sign out and back in with email and password, check Profile's security section,
# then lock the session and unlock it with the PIN.
---
- evalScript: ${output.runId = Date.now().toString()}
- runFlow:
    file: ../../subflows/sign-up.yaml
    env:
      NAME: "Maestro User ${output.runId}"
      EMAIL: "maestro.auth.${output.runId}@example.com"
- runFlow:
    file: ../../subflows/sign-in.yaml
    env:
      EMAIL: "maestro.auth.${output.runId}@example.com"

# Profile: an email/password account shows its security options.
- tapOn:
    id: "dashboard-avatar-menu"
- tapOn:
    id: "menu-profile"
- scrollUntilVisible:
    element:
      text: "Security"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: ".*Email/password.*"
- assertVisible:
    text: "Change Password"
    optional: true

# Developer options (seven taps on the version) reveal "Lock session".
- scrollUntilVisible:
    element:
      text: "Traxettle v.*"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 7
    commands:
      - tapOn:
          text: "Traxettle v.*"
          optional: true
- scrollUntilVisible:
    element:
      id: "profile-lock-session-button"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "profile-lock-session-button"
- extendedWaitUntil:
    visible:
      id: "unlock-pin-input"
    timeout: 10000
- tapOn:
    id: "unlock-pin-input"
- inputText: "1234"
- tapOn:
    id: "unlock-pin-submit-button"
# Unlocked: the PIN screen is gone (Profile reloads, so its developer options are hidden again).
- extendedWaitUntil:
    notVisible:
      id: "unlock-pin-input"
    timeout: 10000
