appId: com.traxettle.app
name: Groups — invite a member, they accept, the organiser groups them
---
- evalScript: ${output.runId = Date.now().toString()}
- runFlow:
    file: ../../subflows/sign-up.yaml
    env:
      NAME: "Group Admin ${output.runId}"
      EMAIL: "grpadm${output.runId}@example.com"

# Create an event and invite the member.
- runFlow:
    file: ../../subflows/create-split-event.yaml
    env:
      EVENT: "Group Event ${output.runId}"
      CURRENCY: "USD"
- extendedWaitUntil:
    visible:
      id: "event-detail-tab-participants"
    timeout: 20000
- tapOn:
    id: "event-detail-tab-participants"
- tapOn:
    id: "event-detail-open-invite-modal-participants"
- tapOn:
    id: "event-detail-invite-email-input"
- inputText: "grpmb${output.runId}@example.com"
- tapOn:
    text: "Send"
- tapOn:
    text: "Send"
    optional: true
- extendedWaitUntil:
    notVisible: "Invite to Event"
    timeout: 10000

# The member signs up and accepts from Invitations.
- runFlow:
    file: ../../subflows/sign-up.yaml
    env:
      NAME: "Group Member ${output.runId}"
      EMAIL: "grpmb${output.runId}@example.com"
- tapOn:
    id: "dashboard-avatar-menu"
- tapOn:
    id: "menu-invitations"
- extendedWaitUntil:
    visible: "Accept"
    timeout: 15000
- tapOn: "Accept"
- tapOn:
    text: "OK"
    optional: true

# Back as the organiser: group the two of them.
- runFlow:
    file: ../../subflows/sign-in.yaml
    env:
      EMAIL: "grpadm${output.runId}@example.com"
- extendedWaitUntil:
    visible: ".*Group Event ${output.runId}.*"
    timeout: 20000
- tapOn: ".*Group Event ${output.runId}.*"
- extendedWaitUntil:
    visible:
      id: "event-detail-tab-groups"
    timeout: 20000
- tapOn:
    id: "event-detail-tab-groups"
- tapOn:
    id: "event-detail-open-create-group-modal"
- tapOn:
    id: "create-group-name-input"
- inputText: "Family ${output.runId}"
# Close the keyboard: it covers the member list.
- pressKey: Enter
# Tick both people: the organiser and the member who just joined.
- tapOn:
    id: "create-group-member-.*"
    index: 0
- tapOn:
    id: "create-group-member-.*"
    index: 1
- scrollUntilVisible:
    element:
      id: "create-group-submit-button"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "create-group-submit-button"
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible: ".*Family ${output.runId}.*"
    timeout: 10000
