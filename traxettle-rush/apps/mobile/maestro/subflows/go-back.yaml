appId: com.traxettle.app
name: "Subflow: go back one screen"
# Maestro's `back` only works on Android; on iOS, tap the navigation bar's back button.
---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "BackButton"
- runFlow:
    when:
      platform: Android
    commands:
      - back
