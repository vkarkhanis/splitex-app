appId: com.traxettle.app
name: "Subflow: after signing in, get to the dashboard"
# Whatever the app asks for after a sign-in: set the PIN (1234) or unlock with it, and skip the
# first-run walkthrough. Each is optional, so it works whichever screens this build shows.
---
# iOS offers to save the password after a sign-in: decline it, it covers the app.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 4000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "dashboard-create-event-button"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: "setup-pin-input"
    commands:
      - runFlow: set-pin.yaml
- runFlow:
    when:
      visible:
        id: "unlock-pin-input"
    commands:
      - tapOn:
          id: "unlock-pin-input"
      - inputText: "1234"
      - tapOn:
          id: "unlock-pin-submit-button"
- extendedWaitUntil:
    visible: "Skip"
    timeout: 4000
    optional: true
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    visible:
      id: "dashboard-create-event-button"
    timeout: 30000
