appId: com.traxettle.app
name: "Subflow: register a fresh user and reach the dashboard"
# env: NAME (display name), EMAIL. Password Password123!, PIN 1234.
# Starts from a clean app: signs out anyone left over, registers, sets the PIN.
---
- launchApp:
    clearState: true
- runFlow: sign-out.yaml
- tapOn:
    id: "login-go-register"
- extendedWaitUntil:
    visible:
      id: "register-display-name-input"
    timeout: 15000
- tapOn:
    id: "register-display-name-input"
- inputText: ${NAME}
- tapOn:
    id: "register-email-input"
- inputText: ${EMAIL}
# iOS password autofill swallows typing into a hidden password field: show it first.
- tapOn:
    text: "Show password"
    optional: true
- tapOn:
    id: "register-password-input"
- inputText: "Password123!"
# Submit with the keyboard's Enter key: hiding the keyboard on iOS can tap "Sign up with Apple".
- pressKey: Enter
- runFlow: after-sign-in.yaml
